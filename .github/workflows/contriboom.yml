name: Update contribution animation

on:
  schedule:
    # Daily at 00:23 UTC (08:23 Asia/Shanghai).
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contriboom-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate dark contribution arena
        id: contriboom-dark
        uses: ststyin/contriboom@v1.0.0
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark
          output-dir: images/contriboom/dark

      - name: Generate light contribution arena
        id: contriboom-light
        uses: ststyin/contriboom@v1.0.0
        with:
          username: ${{ github.repository_owner }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          theme: github
          output-dir: images/contriboom/light

      - name: Commit updated images
        shell: bash
        run: |
          git add -f images/contriboom
          if git diff --cached --quiet; then
            echo "Contribution images are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update contriboom animation"
          git push
